{{ define "main" }}
<section class="projects-page">
    <div class="container">
        <header>
            <h1>{{ .Title }}</h1>
        </header>
        <div class="content">
            {{ .Content }}
        </div>
        
        {{ if .Pages }}
        <div class="projects-grid">
            {{ range .Pages }}
            <article class="project-tile">
                <a href="{{ .Permalink }}" class="project-link">
                    <div class="project-info">
                        <h3 class="project-title">{{ .Title }}</h3>
                    </div>
                    <div class="project-thumbnail">
                        {{ if .Params.thumbnail }}
                            <img src="{{ .Params.thumbnail | absURL }}" alt="{{ .Title }}" loading="lazy">
                        {{ else }}
                            <div class="placeholder-thumbnail">
                                <span>{{ substr .Title 0 1 }}</span>
                            </div>
                        {{ end }}
                    </div>
                </a>
            </article>
            {{ end }}
        </div>
        {{ end }}
    </div>
</section>
{{ end }}
